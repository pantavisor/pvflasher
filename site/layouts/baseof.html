<!doctype html>
<html lang="{{ site.Language.Locale }}" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ if .IsHome }}pvflasher · Fast, verified image flashing{{ else }}{{ partial "title.html" . }} · pvflasher{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <meta name="theme-color" content="#653cf1">
  <meta property="og:title" content="pvflasher">
  <meta property="og:description" content="{{ site.Params.description }}">
  <meta property="og:image" content="{{ "screenshot.png" | absURL }}">
  <link rel="icon" type="image/png" href="{{ "icon.png" | relURL }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  {{ with resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
  {{ end }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-doc{{ end }}">
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ with resources.Get "js/main.js" | js.Build (dict "minify" true) | fingerprint }}
  <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
  {{ end }}
</body>
</html>
