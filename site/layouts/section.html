{{ define "main" }}
<div class="wrap doc-index">
  <p class="eyebrow">Documentation</p>
  <h1>Guides</h1>
  <ul class="guide-list">
    {{- range .RegularPages.ByTitle }}

    {{- end }}
  </ul>
</div>
{{ end }}
